name: CMake

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: [OFF, ON]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_TESTING=ON
          -DLIBSERIALPORT_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/cmake-package -B package-test
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build installed-package consumer
        run: cmake --build package-test --config Release --parallel
